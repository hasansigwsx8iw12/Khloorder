<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KHLLO NET | حسابي</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }


        :root{

            --bg:#04100b;
            --card:#0b2118;
            --card2:#071910;
            --green:#28ed91;
            --dark:#0a9c62;
            --text:#f4fff9;
            --muted:#91afa1;
            --danger:#ff6877;
            --border:#28ed9125;

        }


        body{

            min-height:100vh;

            font-family:
                'Cairo',
                Arial,
                sans-serif;

            background:

                radial-gradient(
                    circle at 15% 10%,
                    #164d3480,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    #0b714c55,
                    transparent 30%
                ),

                var(--bg);

            color:var(--text);

        }


        /* SIDEBAR */

        .sidebar{

            width:260px;

            height:100vh;

            position:fixed;

            top:0;
            right:0;

            background:#0b2118;

            border-left:
                1px solid
                rgba(40,237,145,.15);

            box-shadow:
                0 0 25px #0008;

            z-index:1000;

        }


        .side-logo{

            height:90px;

            display:flex;

            align-items:center;

            justify-content:center;

            color:#fff;

            font-size:22px;

            font-weight:800;

            border-bottom:
                1px solid
                #ffffff18;

        }


        .sidebar ul{

            list-style:none;

            padding:15px 10px;

        }


        .sidebar li{

            margin:8px 0;

        }


        .sidebar a{

            color:#fff;

            text-decoration:none;

            display:flex;

            align-items:center;

            gap:15px;

            padding:14px 16px;

            border-radius:12px;

            transition:.3s;

            font-size:15px;

        }


        .sidebar a:hover{

            background:#28ed9125;

        }


        .sidebar li.active a{

            background:var(--green);

            color:#04100b;

        }


        .sidebar i{

            width:22px;

            text-align:center;

            font-size:18px;

        }


        /* PAGE */

        .page{

            width:calc(100% - 260px);

            margin-right:260px;

            padding:35px;

        }


        .brand{

            display:flex;

            align-items:center;

            gap:12px;

            margin-bottom:30px;

        }


        .logo{

            width:55px;

            height:55px;

            border-radius:17px;

            display:grid;

            place-items:center;

            background:
                linear-gradient(
                    135deg,
                    var(--green),
                    var(--dark)
                );

            color:#03140d;

            font-size:29px;

            font-weight:900;

        }


        .brand h2{

            font-size:22px;

        }


        .brand p{

            color:var(--muted);

            font-size:12px;

        }


        /* CARD */

        .profile-card{

            max-width:700px;

            margin:auto;

            background:#0b2118ee;

            border:
                1px solid
                var(--border);

            border-radius:25px;

            padding:30px;

            box-shadow:
                0 20px 60px
                #0005;

        }


        .profile-title{

            margin-bottom:25px;

        }


        .profile-title h1{

            font-size:25px;

        }


        .profile-title p{

            color:var(--muted);

            font-size:13px;

            margin-top:5px;

        }


        /* PHOTO */

        .photo-area{

            text-align:center;

            margin-bottom:30px;

        }


        .photo-wrapper{

            width:125px;

            height:125px;

            margin:auto;

            position:relative;

        }


        #profileImage{

            width:125px;

            height:125px;

            object-fit:cover;

            border-radius:50%;

            border:
                4px solid
                var(--green);

            background:#071910;

        }


        .photo-button{

            position:absolute;

            bottom:0;

            left:0;

            width:38px;

            height:38px;

            border-radius:50%;

            border:3px solid var(--card);

            background:var(--green);

            color:#04100b;

            display:grid;

            place-items:center;

            cursor:pointer;

        }


        #photoInput{

            display:none;

        }


        .photo-area p{

            color:var(--muted);

            font-size:12px;

            margin-top:10px;

        }


        /* FORM */

        .field{

            margin-bottom:18px;

        }


        .field label{

            display:block;

            margin-bottom:7px;

            font-size:13px;

            color:#d8eee3;

        }


        .field input{

            width:100%;

            padding:14px;

            border:
                1px solid
                #28ed9130;

            border-radius:12px;

            background:#0005;

            color:#fff;

            outline:none;

            font-family:inherit;

            font-size:14px;

        }


        .field input:focus{

            border-color:var(--green);

            box-shadow:
                0 0 0 3px
                #28ed9110;

        }


        .field input[readonly]{

            opacity:.65;

            cursor:not-allowed;

        }


        .required{

            color:var(--danger);

        }


        /* BUTTON */

        #saveBtn{

            width:100%;

            border:0;

            border-radius:13px;

            padding:15px;

            margin-top:10px;

            background:
                linear-gradient(
                    135deg,
                    var(--green),
                    var(--dark)
                );

            color:#04100b;

            font-family:inherit;

            font-weight:800;

            font-size:15px;

            cursor:pointer;

        }


        #saveBtn:disabled{

            opacity:.6;

            cursor:not-allowed;

        }


        #message{

            text-align:center;

            margin-top:15px;

            font-size:13px;

        }


        .success{

            color:var(--green);

        }


        .error{

            color:var(--danger);

        }


        @media(max-width:700px){

            .sidebar{

                width:75px;

            }


            .side-logo{

                font-size:0;

                height:75px;

            }


            .side-logo::after{

                content:"K";

                font-size:26px;

            }


            .sidebar a{

                justify-content:center;

                padding:14px 8px;

            }


            .sidebar a span{

                display:none;

            }


            .page{

                width:calc(100% - 75px);

                margin-right:75px;

                padding:15px;

            }


            .profile-card{

                padding:20px;

                border-radius:20px;

            }

        }


    </style>

</head>


<body>


<aside class="sidebar">

    <div class="side-logo">
        KHLLO NET
    </div>


<ul>

<li class="active">

<li>

<li>
<a href="installations.html">
<i class="fa-solid fa-satellite-dish"></i>

</li>

<li class="active">
<a href="transfers.html">

<li>

<li>

الحسابات

</li>




<li>

<i class="fa-solid fa-users"></i>

حسابي

<li>

<i class="fa-solid fa-right-from-bracket"></i>

</a>

</li>



</ul>


</aside>


<main class="page">


    <header class="brand">

        <div class="logo">
            K
        </div>

        <div>

            <h2>KHLLO NET</h2>

            <p>
                إدارة حساب الموظف
            </p>

        </div>

    </header>


    <section class="profile-card">


        <div class="profile-title">

            <h1>
                <i class="fa-solid fa-user-gear"></i>
                تعديل حسابي
            </h1>

            <p>
                أضف صورتك ورقم هاتفك ليتم التواصل معك عند تكليفك بطلب.
            </p>

        </div>


        <div class="photo-area">

            <div class="photo-wrapper">

                <img
                    id="profileImage"
                    src="https://via.placeholder.com/125?text=User"
                    alt="صورة الموظف"
                >

                <label
                    class="photo-button"
                    for="photoInput"
                >

                    <i class="fa-solid fa-camera"></i>

                </label>

            </div>


            <input
                id="photoInput"
                type="file"
                accept="image/*"
            >


            <p>
                اضغط على الكاميرا لتغيير الصورة
            </p>

        </div>


        <div class="field">

            <label>
                الاسم
            </label>

            <input
                id="name"
                type="text"
                readonly
            >

        </div>


        <div class="field">

            <label>
                البريد الإلكتروني
            </label>

            <input
                id="email"
                type="email"
                readonly
            >

        </div>


        <div class="field">

            <label>
                رقم الهاتف
                <span class="required">*</span>
            </label>

            <input
                id="phone"
                type="tel"
                placeholder="مثال: 9639XXXXXXXX"
                required
            >

        </div>


        <button id="saveBtn">

            <i class="fa-solid fa-floppy-disk"></i>

            حفظ التعديلات

        </button>


        <div id="message"></div>


    </section>
