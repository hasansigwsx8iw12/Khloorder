<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KHLLO NET | الطلبات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04100b;--card:#0b2118;--green:#28ed91;--dark:#0a9c62;--text:#f4fff9;--muted:#91afa1;--danger:#ff6877}
body{min-height:100vh;font-family:Arial,Tahoma,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 10%,#164d3480,transparent 30%),radial-gradient(circle at 90% 90%,#0b714c55,transparent 30%),var(--bg)}
.page{width:min(1200px,94%);margin:auto;padding:30px 0}.brand{display:flex;align-items:center;gap:12px;margin-bottom:25px}.logo{width:55px;height:55px;border-radius:17px;display:grid;place-items:center;background:linear-gradient(135deg,var(--green),var(--dark));color:#03140d;font-size:29px;font-weight:900}.brand h2{font-size:22px}.brand p{font-size:12px;color:var(--muted)}
.card{border:1px solid #28ed9128;border-radius:23px;background:#0b2118ee;box-shadow:0 20px 60px #0007}.stats{padding:20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.stats span{color:var(--muted);font-size:13px}.stats strong{display:block;color:var(--green);font-size:30px}.refresh{width:auto;margin:0;padding:11px 20px}.requests{padding:25px}.title{margin-bottom:20px}.title h1{font-size:24px}.title p{color:var(--muted);font-size:12px;margin-top:4px}.table-wrap{overflow:auto;border:1px solid #28ed9120;border-radius:15px}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:14px;border-bottom:1px solid #28ed9118;text-align:right;font-size:13px}th{color:var(--green);background:#28ed9108}td{color:#dcebe5}tr:last-child td{border:0}.national{direction:ltr;text-align:right}.empty{text-align:center!important;padding:35px!important;color:var(--muted)}.error{color:var(--danger)}
.accept-btn{width:auto;margin:0;padding:9px 13px;font-size:12px}.accepted{display:inline-block;color:var(--green);font-weight:bold;font-size:12px}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.hidden{display:none}.modal-box{width:min(430px,100%);background:#0b2118;border:1px solid #28ed9135;border-radius:22px;padding:25px;box-shadow:0 25px 80px #000}.modal-box h2{font-size:20px}.modal-box p{color:var(--muted);font-size:13px;margin:6px 0 18px}.modal-box input{width:100%;padding:14px;border-radius:13px;border:1px solid #28ed9130;background:#0005;color:#fff;font-size:16px;outline:0}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1;width:auto}.cancel{background:#162d24;color:#b5c9c0}
@media(max-width:600px){.page{padding-top:20px}.requests{padding:17px}.stats{align-items:flex-start}}
</style>
</head>
<body>
<main class="page">
<header class="brand"><div class="logo">K</div><div><h2>KHLLO NET</h2><p>إدارة طلبات التعويض</p></div></header>
<section class="card stats"><div><span>إجمالي الطلبات</span><strong id="total">0</strong></div><button id="refreshBtn" class="refresh">تحديث</button></section>
<section class="card requests">
<div class="title"><h1>الطلبات المقدمة</h1><p>يمكنك قبول الطلب وتحديد مدة التعويض.</p></div>
<div class="table-wrap">
<table><thead><tr><th>#</th><th>الاسم</th><th>الرقم الوطني</th><th>تاريخ الطلب</th><th>الحالة</th></tr></thead>
<tbody id="requestsBody"><tr><td colspan="5" class="empty">جاري التحميل...</td></tr></tbody></table>
</div>
</section>
</main>

<div id="acceptModal" class="modal hidden">
<div class="modal-box">
<h2>قبول طلب التعويض</h2>
<p>الطلب: <strong id="modalName"></strong></p>
<label>عدد أيام التعويض</label>
<input id="daysInput" type="number" min="1" max="365" value="7">
<div class="modal-actions">
<button id="cancelAccept" class="cancel">إلغاء</button>
<button id="confirmAccept">تأكيد القبول</button>
</div>
</div>
</div>

<script type="module" src="admin.js"></script>
</body>
</html>
